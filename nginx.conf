# The whole configuration, not a drop-in under conf.d: the packaged default
# binds port 80 and writes its pid and temporary files to paths only root can
# create, and this image runs as an unprivileged user.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx logs 000 when a client aborts before a status is set, and JSON
    # forbids leading zeros. Normalised here so the field can stay a number and
    # stay comparable, rather than becoming a string to survive the one case.
    map $status $status_json {
        default $status;
        "000"   0;
    }

    # Better Stack's nginx source type expects Vector's shape: the parsed fields
    # namespaced under "nginx", with host and message alongside. Emitting it here
    # is the same bytes Vector would post to the same endpoint, without carrying a
    # collector in a container that serves static files.
    #
    # dt is the field read as the event time; without it a line is stamped on
    # arrival. escape=json keeps a quote or backslash in a path from breaking it.
    log_format betterstack escape=json
        '{"dt":"$time_iso8601",'
        '"host":"$hostname",'
        '"message":"$request_method $uri $status",'
        '"nginx":{'
        '"client":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"query":"$args",'
        '"status":$status_json,'
        '"size":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"agent":"$http_user_agent",'
        '"host":"$host",'
        '"request_time":$request_time}}';

    access_log /dev/stdout betterstack;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile   on;
    tcp_nopush on;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # Both names reach this container, and only one of them serves. Sending www
    # to the bare domain leaves the site one origin, which is what lets the
    # backend allow a single value and what stops the same page having two URLs.
    # Written as a capture rather than a literal so the image carries no domain.
    server {
        listen 8080;
        server_name ~^www\.(?<apex>.+)$;
        return 301 https://$apex$request_uri;
    }

    server {
        # 8080 rather than 80 because an unprivileged worker cannot bind below
        # 1024. Scaleway reserves 8008, 8012, 8013, 8022, 8112, 9090 and 9091.
        listen 8080 default_server;

        root /usr/share/nginx/html;

        # TLS is terminated upstream, so the scheme the client used survives
        # only in this header. Matching "http" rather than negating "https"
        # means a request arriving without the header is served as-is: a proxy
        # that sets nothing can never put this in a redirect loop with itself.
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Vite hashes these filenames, so the bytes behind one URL never change.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Everything else keeps its name across releases, so a cached copy would
        # outlive the deploy that replaced it. Revalidation costs a 304.
        location / {
            add_header Cache-Control "no-cache";
        }
    }
}
