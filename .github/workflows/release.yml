# Release pipeline — GitHub Actions.
#
# On a semver tag, run the full quality gate and push one container image to the
# Scaleway registry namespace, tagged with the release. Infra pins that tag to
# deploy it.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: rg.nl-ams.scw.cloud
  NAMESPACE: mdijkstra-homepage
  IMAGE: homepage-site

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level, not on the build step: vitest resolves the same vite.config.ts
    # that holds the guard, so `npm test` throws at config time without it. The
    # value is inlined into the bundle, which is why it is a variable and not a
    # secret.
    env:
      VITE_AGENT_URL: ${{ vars.VITE_AGENT_URL }}
      VITE_BETTERSTACK_TOKEN: ${{ vars.VITE_BETTERSTACK_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # The tag must match package.json — use `npm version` to cut releases so
      # they stay in sync; this fails the build if a hand-made tag diverges.
      - name: Verify tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Log in to the registry
        env:
          SCW_SECRET_KEY: ${{ secrets.REGISTRY_PUSH_SECRET_KEY }}
        run: |
          echo "$SCW_SECRET_KEY" |
            docker login "$REGISTRY/$NAMESPACE" -u nologin --password-stdin

      # The Dockerfile runs the production build itself, so the image is
      # reproducible from a clone rather than from this runner's working tree.
      - name: Build and push
        run: |
          IMAGE_REF="$REGISTRY/$NAMESPACE/$IMAGE:$GITHUB_REF_NAME"
          docker build \
            --build-arg "VITE_AGENT_URL=$VITE_AGENT_URL" \
            --build-arg "VITE_BETTERSTACK_TOKEN=$VITE_BETTERSTACK_TOKEN" \
            --tag "$IMAGE_REF" \
            .
          docker push "$IMAGE_REF"
